<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiB2aWV3Qm94PSIwIDAgNTEyIDUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIGZpbGw9IiMwMDAiLz48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjEyMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjMyIi8+PC9zdmc+">
    
    <title>PDV PIX • Pro Elite 1:1</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        primary: 'var(--primary-color)',
                        terminalBg: 'var(--bg-color)'
                    } 
                } 
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
        
        :root { 
            --primary-color: #10b981; 
            --bg-color: #18181b;
            --primary-glow: rgba(16, 185, 129, 0.15);
        }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Inter', sans-serif; overflow: hidden; 
            user-select: none; -webkit-user-select: none; 
            background-color: #000000;
            display: flex; align-items: center; justify-content: center;
        }

        /* O Quadrado Proporcional 1:1 Cravado */
        .pdv-square {
            position: relative;
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            max-width: 1020px;
            max-height: 1020px;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-color);
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 80px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.03);
            transition: box-shadow 0.4s ease;
        }

        .mode-payment .pdv-square { 
            box-shadow: inset 0 0 80px var(--primary-glow), 0 25px 80px rgba(0,0,0,0.9); 
        }

        /* QR Codes Gigantes (80% da área útil) */
        .qr-giant-wrapper { 
            background: #ffffff; 
            padding: 12px; 
            border-radius: 32px; 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            aspect-ratio: 1/1;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 5px solid rgba(0,0,0,0.04);
        }
        .qr-giant-wrapper canvas, .qr-giant-wrapper img {
            width: 100% !important;
            height: 100% !important;
            border-radius: 14px;
        }

        /* Visor Centralizado */
        .display-area {
            flex: 1 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            min-height: 100px; /* ajuste conforme o desejado para o visor */
            overflow-y: auto;
        }

        /* Teclado e Botão de Finalização */
        .keypad-section {
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-top: 0px solid rgba(255,255,255,0.02);
        }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .keypad-btn {
          background: rgba(255,255,255,0.02);
          border-radius: 14px;
          display: flex; 
          align-items: center; 
          justify-content: center; 
          font-size: 1.6rem; 
          font-weight: 500; 
          cursor: pointer; 
          height: 35px;  /* ajuste aqui */
          transition: all 0.2s;
          border: 1px solid rgba(255,255,255,0.02);
          color: white;
          
        }

        .keypad-btn:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.92); }
        .keypad-btn.special { color: var(--primary-color); font-weight: 900; font-size: 1.8rem; }
        
        .btn-enter-pdv { 
            background: #ffffff; color: #000000; font-weight: 900; 
            border-radius: 18px; font-size: 1rem; text-transform: uppercase;
            width: calc(100% - 24px); height: 52px; margin: 8px 12px 12px 12px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* Overlays */
        .view-overlay { 
            background: var(--bg-color); z-index: 100; position: absolute; inset: 0; 
            display: none; flex-direction: column; padding: 1.5rem; overflow-y: auto; 
        }
        .view-overlay.active { display: flex; }

        .cart-list-mini { max-height: 60px; overflow-y: auto; width: 100%; text-align: center; }
        .minimal-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px 0; font-size: 0.9rem; outline: none; transition: all 0.3s; color: white; }
        .minimal-input:focus { border-bottom-color: var(--primary-color); }
        .custom-scroll::-webkit-scrollbar { width: 0px; }
        .shortcut-item-row { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; }
    </style>
</head>
<body id="app-body">

    <div class="pdv-square" id="main-terminal">
        
        <!-- Feedback Toast -->
        <div id="message-box" class="absolute top-4 left-1/2 -translate-x-1/2 bg-zinc-800 border border-zinc-700 text-white px-4 py-1.5 rounded-full text-[9px] font-bold flex items-center gap-2 shadow-2xl transition-all opacity-0 pointer-events-none z-[300]">
            <div id="msg-dot" class="w-1 h-1 bg-primary rounded-full"></div>
            <span id="message-text">OK</span>
        </div>

        <!-- Barra de Status com Bateria Real -->
        <div class="px-6 pt-6 pb-1 flex justify-between items-center z-10 relative">
            <div class="flex items-center gap-2">
                <div id="status-dot" class="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-pulse"></div>
                <span id="terminal-name-label" class="text-[8px] font-black tracking-widest uppercase opacity-40">OFFLINE</span>
            </div>
            <div class="flex items-center gap-4">
                <div id="battery-status" class="flex items-center gap-1 opacity-40 transition-opacity">
                    <span id="battery-level" class="text-[8px] font-bold text-white">--%</span>
                    <i data-lucide="battery" class="text-white" size="10"></i>
                </div>
                <button onclick="toggleSettings()" class="text-[9px] font-black text-zinc-500 hover:text-white transition-all p-1">
                    <span id="clock">00:00:00</span>
                </button>
            </div>
        </div>

        <!-- Visor de Venda -->
        <div class="display-area text-white">
            <div class="cart-list-mini custom-scroll px-4 mb-1" id="main-cart-list"></div>

            <div id="main-total-badge" class="mb-1 opacity-0 transition-all scale-75">
                <div class="bg-primary/20 text-primary border border-primary/20 px-3 py-1 rounded-full text-[20px] font-black uppercase">
                    R$ <span id="main-cart-total-val">0,00</span>
                </div>
            </div>

            <span id="instruction-label" class="text-[9px] text-zinc-500 tracking-[0.3em] uppercase mb-1 opacity-40">PDV ELITE PRO</span>
            
            <div class="flex items-baseline justify-center w-full">
                <span id="display-currency" class="hidden text-sm font-light text-zinc-500 mr-1">R$</span>
                <span id="display-value" class="text-[5.5rem] font-bold tracking-tighter leading-none transition-all duration-200">0</span>
            </div>
            
            <div id="back-hint" class="mt-1 text-[7px] font-black tracking-widest uppercase opacity-0 text-zinc-500 transition-opacity">
                Apagar p/ Limpar
            </div>
        </div>

        <!-- Teclado Encaixado na Base -->
        <div class="keypad-section" id="container-teclado-virtual">
            <div class="keypad-grid">
                <button onclick="pressKey('1')" class="keypad-btn">1</button>
                <button onclick="pressKey('2')" class="keypad-btn">2</button>
                <button onclick="pressKey('3')" class="keypad-btn">3</button>
                <button onclick="pressKey('4')" class="keypad-btn">4</button>
                <button onclick="pressKey('5')" class="keypad-btn">5</button>
                <button onclick="pressKey('6')" class="keypad-btn">6</button>
                <button onclick="pressKey('7')" class="keypad-btn">7</button>
                <button onclick="pressKey('8')" class="keypad-btn">8</button>
                <button onclick="pressKey('9')" class="keypad-btn">9</button>
                <button onclick="pressKey('*')" class="keypad-btn special">*</button>
                <button onclick="pressKey('0')" class="keypad-btn">0</button>
                <button onclick="pressKey('back')" class="keypad-btn text-zinc-500"><i data-lucide="delete" size="22"></i></button>
            </div>
            <button onclick="pressKey('enter')" class="btn-enter-pdv active:scale-95 transition-all">
                <span>Finalizar Venda</span>
                <i data-lucide="arrow-right" size="18"></i>
            </button>
        </div>

        <!-- Overlays QR Gigantes -->
        <div id="view-pix" class="view-overlay items-center justify-center text-center">
            <div class="qr-giant-wrapper mb-4"><div id="pix-qr-box"></div></div>
            <span class="text-2xl font-black text-white tracking-tighter mb-4" id="pix-amount-label">R$ 0,00</span>
            <button onclick="copyPixCode()" class="w-full py-4 bg-white/10 rounded-2xl text-[9px] font-black uppercase mb-4 active:scale-95">COPIAR PIX</button>
            <button onclick="resetApp()" class="text-zinc-500 text-[9px] font-bold uppercase underline">Cancelar</button>
        </div>

        <div id="view-wifi" class="view-overlay items-center justify-center text-center">
            <div class="qr-giant-wrapper mb-6"><div id="wifi-qr-box"></div></div>
            <p id="wifi-ssid-val" class="text-white font-bold text-lg mb-8"></p>
            <button onclick="resetApp()" class="px-10 py-3 rounded-xl bg-white text-black font-bold uppercase text-[9px]">VOLTAR</button>
        </div>

        <div id="view-support" class="view-overlay items-center justify-center text-center">
            <div class="qr-giant-wrapper mb-6"><div id="whatsapp-qr"></div></div>
            <p id="whatsapp-num-val" class="text-white font-bold text-lg mb-8"></p>
            <button onclick="resetApp()" class="px-10 py-3 rounded-xl border border-white/10 text-white font-bold uppercase text-[9px]">FECHAR</button>
        </div>

        <!-- Ajustes Completos -->
        <div id="view-settings" class="view-overlay">
            <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-light text-white tracking-tighter">Ajustes</h2><button onclick="resetApp()" class="text-white"><i data-lucide="x" size="24"></i></button></div>
            <div class="space-y-6 flex-1 overflow-y-auto custom-scroll pb-6 text-left">
                <div>
                    <div class="flex items-center justify-between mb-3 border-b border-white/5 pb-1">
                        <p class="text-white font-bold text-[10px] uppercase tracking-widest">Inventário Turbo</p>
                        <button onclick="addShortcutUI()" class="text-primary text-[10px] font-black uppercase">+ NOVO</button>
                    </div>
                    <div id="shortcuts-config-list" class="space-y-2"></div>
                </div>
                <div class="space-y-4">
                    <p class="text-zinc-500 text-[8px] uppercase font-bold border-b border-white/5 pb-1">Sistema & Hardware</p>
                    <input type="text" id="input-terminal-name" class="minimal-input" placeholder="Nome Caixa">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="input-kb-type" class="minimal-input text-[10px]"><option value="virtual">Teclado Virtual</option><option value="fisico">Físico</option></select>
                        <input type="number" id="input-daily-goal" class="minimal-input" placeholder="Meta R$">
                    </div>
                    <input type="text" id="input-pix-key" class="minimal-input" placeholder="Chave PIX Global">
                    <input type="password" id="input-api-key" class="minimal-input" placeholder="Token MP">
                    <input type="text" id="input-whatsapp" class="minimal-input" placeholder="WhatsApp Suporte">
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <select id="input-bg" class="minimal-input text-[10px]" onchange="previewTheme()"><option value="#18181b">Carbono</option><option value="#0f172a">Oceano</option><option value="#000000">Preto OLED</option></select>
                        <select id="input-color" class="minimal-input text-[10px]" onchange="previewTheme()"><option value="#10b981">Esmeralda</option><option value="#8b5cf6">Violeta</option><option value="#3b82f6">Azul</option></select>
                    </div>
                </div>
            </div>
            <button onclick="saveSettings()" id="btn-save" class="py-4 w-full rounded-2xl bg-primary text-black font-black uppercase text-[10px] mt-2 active:scale-95">Sincronizar</button>
        </div>

        <!-- Sucesso e Recibo -->
        <div id="view-success" class="view-overlay items-center justify-center text-center">
            <div class="w-24 h-24 bg-primary rounded-full flex items-center justify-center mb-6 shadow-[0_0_50px_var(--primary-color)] animate-bounce"><i data-lucide="check" class="text-black" stroke-width="4" size="48"></i></div>
            <h2 class="text-primary font-black uppercase text-xl mb-4 tracking-widest">PAGO!</h2>
            <button id="btn-whatsapp-receipt" class="w-full py-4 bg-zinc-800 rounded-2xl flex items-center justify-center gap-2 font-bold text-[9px] text-white active:scale-95 transition-all">
                <i data-lucide="message-circle" size="16"></i> ENVIAR RECIBO WHATSAPP
            </button>
            <button onclick="resetApp()" class="mt-6 text-zinc-500 text-[10px] uppercase font-bold tracking-widest">Fechar</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyD3E7c_4jbnLJCGCapM5L8rta6AXVHvZgs", authDomain: "indisponivel-rrehfe.firebaseapp.com", databaseURL: "https://indisponivel-rrehfe.firebaseio.com", projectId: "indisponivel-rrehfe", storageBucket: "indisponivel-rrehfe.firebasestorage.app", messagingSenderId: "880210924564", appId: "1:880210924564:web:fd565cdb0e4f04cd7ac301" };
    const safeAppId = 'pdv-ultra-minimal';
    
    let db, auth, lastPixString = "";
    let currentDigits = "", cartTotal = 0, cartItems = [];
    let unsubscribePayment = null, pdvMode = 'COMMAND', terminalConfig = { terminalName: "CAIXA", pixKey: "", shortcuts: {} };

    const initFirebase = async () => {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app); auth = getAuth(app);
        try { await signInAnonymously(auth); } catch (e) {}
        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, `artifacts/${safeAppId}/public/data/terminal_settings/main`), (snap) => {
                    const data = snap.val();
                    if (data) { 
                        terminalConfig = { ...terminalConfig, ...data }; 
                        if (!terminalConfig.shortcuts) terminalConfig.shortcuts = {};
                        applyThemeSettings(); updateUIFromConfig(); 
                    } 
                });
            }
        });
    };

    function initBatteryMonitor() {
        if ('getBattery' in navigator) {
            navigator.getBattery().then(bat => {
                const up = () => { 
                    const lvl = Math.round(bat.level * 100);
                    const lvlEl = document.getElementById('battery-level');
                    if(lvlEl) lvlEl.textContent = lvl + "%"; 
                    const statEl = document.getElementById('battery-status');
                    if(statEl) statEl.style.opacity = bat.charging ? "1" : "0.4";
                };
                up(); bat.onlevelchange = up; bat.onchargingchange = up;
            });
        }
    }

    window.resetApp = () => { 
        if(unsubscribePayment) unsubscribePayment(); 
        document.querySelectorAll('.view-overlay').forEach(v => v.classList.remove('active')); 
        pdvMode = 'COMMAND'; currentDigits = ""; cartTotal = 0; cartItems = []; updateCartUI(); updateDisplay(); 
    };

    window.pressKey = (key) => {
        if (key === 'back') { 
            if ((pdvMode === 'PAYMENT' || cartTotal > 0) && currentDigits === "") { resetApp(); return; }
            currentDigits = currentDigits.slice(0, -1); 
        } 
        else if (key === 'enter') { handleAction(); return; } 
        else { if (currentDigits.length < 15) currentDigits += key; }
        updateDisplay();
    };

    function updateDisplay() {
        const vB = document.getElementById('display-value'), l = document.getElementById('instruction-label'), h = document.getElementById('back-hint');
        if (pdvMode === 'COMMAND') {
            document.getElementById('main-terminal').classList.remove('mode-payment');
            vB.textContent = currentDigits || "0"; vB.className = "text-[5.5rem] font-bold tracking-tighter text-white transition-all";
            const c = currentDigits; h.style.opacity = (cartTotal > 0 && c === "") ? "1" : "0";
            if (c.includes('*')) {
                const parts = c.split('*');
                if (terminalConfig.shortcuts && terminalConfig.shortcuts[parts[1]]) l.textContent = `ADD ${parts[0]}x ${terminalConfig.shortcuts[parts[1]].desc.toUpperCase()}`;
                else l.textContent = "DEFINIR QUANTIDADE";
            } else if (terminalConfig.shortcuts && terminalConfig.shortcuts[c]) {
                const s = terminalConfig.shortcuts[c];
                l.textContent = (s.type === 'venda') ? `ADD: ${s.desc.toUpperCase()}` : `RUN: ${s.desc.toUpperCase()}`;
            } else l.textContent = (cartTotal > 0) ? "ENTER FINALIZA" : "AGUARDANDO CÓDIGO";
        } else {
            document.getElementById('main-terminal').classList.add('mode-payment');
            const v = currentDigits === "" ? 0 : parseInt(currentDigits);
            vB.textContent = (v / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            vB.className = "text-[4.2rem] font-black tracking-tighter text-primary";
            l.textContent = "VALOR MANUAL";
        }
    }

    function handleAction() {
        if (pdvMode === 'COMMAND') {
            const input = currentDigits === "" ? "0" : currentDigits; currentDigits = "";
            if (input.includes('*')) {
                const parts = input.split('*');
                const sc = terminalConfig.shortcuts[parts[1]];
                if (sc && sc.type === 'venda') {
                    const qty = parseInt(parts[0]) || 1;
                    cartTotal += (parseFloat(sc.value) * qty);
                    for(let i=0; i<qty; i++) cartItems.push({ desc: sc.desc, amount: parseFloat(sc.value) });
                    updateCartUI(); updateDisplay(); return;
                }
            }
            if (terminalConfig.shortcuts && terminalConfig.shortcuts[input]) {
                const s = terminalConfig.shortcuts[input];
                if (s.type === 'venda') { cartTotal += parseFloat(s.value); cartItems.push({ desc: s.desc, amount: parseFloat(s.value) }); updateCartUI(); updateDisplay(); return; }
                else {
                    if (s.funcType === 'config') toggleSettings();
                    else if (s.funcType === 'wifi') showWifi(s.ssid, s.pass);
                    else if (s.funcType === 'contato') showSupport(s.whatsapp);
                    return;
                }
            }
            if (input === '0') { if (cartTotal > 0) processSalePIX(cartTotal); else pdvMode = 'PAYMENT'; }
            updateDisplay();
        } else {
            const v = currentDigits === "" ? 0 : parseInt(currentDigits);
            if (v > 0) { cartTotal = v/100; cartItems = [{desc: "Manual", amount: cartTotal}]; processSalePIX(cartTotal); }
        }
    }

    function updateCartUI() {
        const b = document.getElementById('main-total-badge'), vE = document.getElementById('main-cart-total-val'), l = document.getElementById('main-cart-list');
        if (cartTotal > 0) { b.style.opacity = "1"; vE.textContent = cartTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 }); l.innerHTML = cartItems.slice(-3).map(i => `<div class="text-[7px] font-bold uppercase text-primary/80 truncate">• ${i.desc} (R$ ${i.amount.toFixed(2)})</div>`).join(''); }
        else { b.style.opacity = "0"; l.innerHTML = ""; }
    }

    async function processSalePIX(amount) {
        document.getElementById('view-pix').classList.add('active');
        document.getElementById('pix-amount-label').textContent = amount.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        lastPixString = "00020101021126580014BR.GOV.BCB.PIX0136"+(terminalConfig.pixKey || "pix")+"52040000530398654"+amount.toFixed(2).length.toString().padStart(2,'0')+amount.toFixed(2)+"5802BR5903PDV6009SAO PAULO62070503***6304";
        document.getElementById('pix-qr-box').innerHTML = "";
        new QRCode(document.getElementById('pix-qr-box'), { text: lastPixString, width: 450, height: 450 });
    }

    window.addShortcutUI = () => renderShortcutRow(Date.now(), null, true);
    function renderShortcutRow(id, s, isEdit) {
        const container = document.getElementById('shortcuts-config-list');
        if (isEdit) {
            const h = `<div class="bg-white/5 p-3 rounded-xl mb-2" id="sc-${id}"><div class="grid grid-cols-7 gap-1 items-center"><input type="text" placeholder="C" class="col-span-1 minimal-input text-center text-primary" data-key="trigger" value="${s ? s.trigger : ''}"><select class="col-span-2 minimal-input text-[8px]" data-key="type" onchange="updateFields('${id}')"><option value="venda" ${s?.type === 'venda' ? 'selected' : ''}>Venda</option><option value="funcao" ${s?.type === 'funcao' ? 'selected' : ''}>Função</option></select><input type="text" placeholder="D" class="col-span-3 minimal-input text-[9px]" data-key="desc" value="${s ? s.desc : ''}"><button onclick="document.getElementById('sc-${id}').remove()" class="col-span-1 text-red-500"><i data-lucide="trash-2" size="14"></i></button></div><div id="fields-${id}" class="mt-1"></div></div>`;
            const tD = document.createElement('div'); tD.innerHTML = h; container.appendChild(tD.firstElementChild); updateFields(id, s);
        } else {
            const tL = s.type === 'venda' ? `R$ ${parseFloat(s.value || 0).toFixed(2)}` : (s.funcType || 'FUNC').toUpperCase();
            const h = `<div class="shortcut-item-row" onclick="editShort('${id}', '${btoa(encodeURIComponent(JSON.stringify(s)))}')"><span class="text-primary font-black text-[10px]">${s.trigger} | ${s.desc}</span><i data-lucide="edit-3" size="10"></i><input type="hidden" data-key="trigger" value="${s.trigger}"><input type="hidden" data-key="type" value="${s.type}"><input type="hidden" data-key="desc" value="${s.desc}"><div class="hidden" id="fields-${id}"></div></div>`;
            const tD = document.createElement('div'); tD.innerHTML = h; container.appendChild(tD.firstElementChild);
            const f = document.getElementById(`fields-${id}`); if(s.type === 'venda') f.innerHTML = `<input type="hidden" data-key="value" value="${s.value}">`; else f.innerHTML = `<input type="hidden" data-key="funcType" value="${s.funcType}"><input type="hidden" data-key="ssid" value="${s.ssid || ''}"><input type="hidden" data-key="pass" value="${s.pass || ''}"><input type="hidden" data-key="whatsapp" value="${s.whatsapp || ''}">`;
        }
        lucide.createIcons();
    }

    window.updateFields = (id, ex = null) => {
        const c = document.getElementById(`fields-${id}`); const t = document.querySelector(`#sc-${id} [data-key="type"]`).value; c.innerHTML = "";
        if (t === 'venda') c.innerHTML = `<input type="number" placeholder="Preço" class="minimal-input text-[8px]" data-key="value" value="${ex?.value || ''}">`;
        else { c.innerHTML = `<select class="minimal-input text-[8px] mb-1" data-key="funcType" onchange="updateSub('${id}')"><option value="">Função...</option><option value="wifi" ${ex?.funcType === 'wifi' ? 'selected' : ''}>Wi-Fi</option><option value="contato" ${ex?.funcType === 'contato' ? 'selected' : ''}>Contato</option><option value="config" ${ex?.funcType === 'config' ? 'selected' : ''}>Ajustes</option></select><div id="sub-${id}"></div>`; updateSub(id, ex); }
    };
    window.updateSub = (id, ex = null) => {
        const s = document.getElementById('sub-'+id); if (!s) return; const f = document.querySelector(`#sc-${id} [data-key="funcType"]`).value; s.innerHTML = "";
        if (f === 'wifi') s.innerHTML = `<input type="text" placeholder="SSID" class="minimal-input text-[8px]" data-key="ssid" value="${ex?.ssid || ''}"><input type="text" placeholder="Pass" class="minimal-input text-[8px]" data-key="pass" value="${ex?.pass || ''}">`;
        else if (f === 'contato') s.innerHTML = `<input type="text" placeholder="WhatsApp" class="minimal-input text-[8px]" data-key="whatsapp" value="${ex?.whatsapp || ''}">`;
    };

    window.editShort = (id, b64) => { const s = JSON.parse(decodeURIComponent(atob(b64))); document.getElementById('shortcuts-config-list').innerHTML=""; renderShortcutRow(id, s, true); };
    window.toggleSettings = () => { const v = document.getElementById('view-settings'); if(v.classList.contains('active')) resetApp(); else { document.getElementById('input-terminal-name').value = terminalConfig.terminalName || ""; document.getElementById('shortcuts-config-list').innerHTML=""; Object.entries(terminalConfig.shortcuts || {}).forEach(([trigger, s]) => renderShortcutRow(Math.random(), {...s, trigger}, false)); v.classList.add('active'); } };
    
    window.saveSettings = async () => {
        const shortcuts = {};
        document.querySelectorAll('#shortcuts-config-list > div').forEach(item => {
            const t = item.querySelector('[data-key="trigger"]')?.value;
            if (t) {
                const s = { 
                    type: item.querySelector('[data-key="type"]')?.value || "venda", 
                    desc: item.querySelector('[data-key="desc"]')?.value || "" 
                };
                if (s.type === 'venda') {
                    s.value = item.querySelector('[data-key="value"]')?.value || "0";
                } else { 
                    s.funcType = item.querySelector('[data-key="funcType"]')?.value || ""; 
                    s.ssid = item.querySelector('[data-key="ssid"]')?.value || ""; 
                    s.pass = item.querySelector('[data-key="pass"]')?.value || ""; 
                    s.whatsapp = item.querySelector('[data-key="whatsapp"]')?.value || ""; 
                }
                shortcuts[t] = s;
            }
        });
        await set(ref(db, `artifacts/${safeAppId}/public/data/terminal_settings/main`), { ...terminalConfig, terminalName: document.getElementById('input-terminal-name').value, pixKey: document.getElementById('input-pix-key').value, kbType: document.getElementById('input-kb-type').value, shortcuts });
        resetApp();
    };

    function previewTheme() { document.documentElement.style.setProperty('--primary-color', document.getElementById('input-color').value); document.documentElement.style.setProperty('--bg-color', document.getElementById('input-bg').value); }
    function applyThemeSettings() { document.documentElement.style.setProperty('--primary-color', terminalConfig.color || '#10b981'); document.documentElement.style.setProperty('--bg-color', terminalConfig.bgColor || '#18181b'); }
    function updateUIFromConfig() { document.getElementById('terminal-name-label').textContent = terminalConfig.terminalName; document.getElementById('container-teclado-virtual').style.display = (terminalConfig.kbType === 'fisico') ? 'none' : 'block'; }
    function showMessage(t) { const b = document.getElementById('message-box'); document.getElementById('message-text').textContent = t; b.style.opacity = "1"; setTimeout(() => b.style.opacity = "0", 2500); }
    function showWifi(ssid, pass) { document.getElementById('view-wifi').classList.add('active'); document.getElementById('wifi-ssid-val').textContent = ssid; document.getElementById('wifi-qr-box').innerHTML=""; new QRCode(document.getElementById('wifi-qr-box'), { text: `WIFI:S:${ssid};P:${pass};;`, width: 450, height: 450 }); }
    function showSupport(num) { document.getElementById('view-support').classList.add('active'); document.getElementById('whatsapp-num-val').textContent = num; document.getElementById('whatsapp-qr').innerHTML=""; new QRCode(document.getElementById('whatsapp-qr'), { text: `https://wa.me/${num}`, width: 450, height: 450 }); }

    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR'); }, 1000);
    window.addEventListener('load', () => { lucide.createIcons(); initFirebase(); initBatteryMonitor(); });
    window.copyPixCode = () => { const e = document.createElement('textarea'); e.value = lastPixString; document.body.appendChild(e); e.select(); document.execCommand('copy'); document.body.removeChild(e); showMessage("Copiado!"); };

    // TECLADO FÍSICO
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        const vM = document.querySelectorAll('.view-overlay.active').length === 0;
        
        if (e.key === 'Escape') resetApp();
        if (!vM) return; // Se houver modal ativo, ignora as outras teclas exceto Escape

        if (e.key === 'Enter') pressKey('enter');
        else if (e.key === 'Backspace') pressKey('back');
        else if (e.key === '*' || e.key === 'x' || e.key === 'X') pressKey('*');
        else if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    });
</script>
</body>
</html>
